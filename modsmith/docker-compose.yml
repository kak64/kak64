# Local development stack: Postgres, Redis, MinIO (S3-compatible), MailHog-style SMTP catcher is optional.
# App services (web, worker) can run natively (`pnpm dev`) against these, or via the `app` profile.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modsmith
      POSTGRES_PASSWORD: modsmith
      POSTGRES_DB: modsmith
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U modsmith"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 20 }

  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/modsmith || true && mc anonymous set none local/modsmith"

  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports: ["3310:3310"]

  web:
    profiles: ["app"]
    build: { context: ., dockerfile: docker/web.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://modsmith:modsmith@postgres:5432/modsmith?schema=public
      REDIS_URL: redis://redis:6379
      # Only used when STORAGE_PROVIDER=s3; ignored for the local provider.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # With STORAGE_PROVIDER=local, web and worker must read and write the SAME directory,
      # otherwise the worker cannot see an upload the web tier just stored.
      LOCAL_STORAGE_DIR: /data/storage
    ports: ["3000:3000"]
    volumes: ["storage:/data/storage"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://modsmith:modsmith@postgres:5432/modsmith?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      LOCAL_STORAGE_DIR: /data/storage
      WORKER_TMP_DIR: /data/tmp
    volumes: ["storage:/data/storage", "workertmp:/data/tmp"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "4", memory: 8G } }

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  # Shared object storage for STORAGE_PROVIDER=local. Back this up: finished resources live here.
  storage: {}
  workertmp: {}
