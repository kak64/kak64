<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- glow halo -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)"/>

  <!-- outer hex ring -->
  <polygon points="100,14 174,57 174,143 100,186 26,143 26,57"
           fill="none" stroke="url(#g1)" stroke-width="3" opacity="0.6"/>
  <polygon points="100,26 164,63 164,137 100,174 36,137 36,63"
           fill="none" stroke="url(#g2)" stroke-width="2" opacity="0.4"/>

  <!-- center dark plate -->
  <polygon points="100,40 152,70 152,130 100,160 48,130 48,70"
           fill="#0c0820" stroke="url(#g1)" stroke-width="2"/>

  <!-- infinity symbol -->
  <g transform="translate(100,100)">
    <path d="M -38,0
             C -38,-22 -22,-22 -10,-2
             C -2,12 2,12 10,-2
             C 22,-22 38,-22 38,0
             C 38,22 22,22 10,2
             C 2,-12 -2,-12 -10,2
             C -22,22 -38,22 -38,0 Z"
          fill="url(#g1)" filter="url(#soft)"/>
    <path d="M -38,0
             C -38,-22 -22,-22 -10,-2
             C -2,12 2,12 10,-2
             C 22,-22 38,-22 38,0
             C 38,22 22,22 10,2
             C 2,-12 -2,-12 -10,2
             C -22,22 -38,22 -38,0 Z"
          fill="none" stroke="white" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- accent dots -->
  <circle cx="100" cy="40" r="3" fill="#fff"/>
  <circle cx="152" cy="100" r="2" fill="#ec4899"/>
  <circle cx="48" cy="100" r="2" fill="#ec4899"/>
  <circle cx="100" cy="160" r="3" fill="#fff"/>
</svg>
